[project]
name = "pandorabox"
version = "0.1.0"
description = "Zero-touch pre-config for Cisco IOS / IOS-XE: discovery, PnP, ZTP, AutoInstall, SNMP, AI agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "pyserial>=3.5",
  "netmiko>=4.3",
  # <5: paramiko 5 removed SHA-1 kex (group14/group1/gex-sha1) and ssh-rsa host keys, the only ones classic IOS 15.x
  # offers (real 2960X 15.2(2)E7: "Incompatible ssh peer (no acceptable kex algorithm)"). 4.x tries modern ones first.
  "paramiko>=3.5.1,<5",
  "pysnmp>=7,<8",
  "cryptography>=47",  # pysnmp 7 needs cryptography.hazmat.decrepit (AES-CFB) for SNMPv3 priv
  "tftpy>=0.8",
  "scapy>=2.5",
  "anthropic>=0.40",
  "httpx>=0.27",
  "pyyaml>=6",  # devicetypes/ (NetBox devicetype-library) and the containerlab checks
  "packaging>=23",  # preflight: installed libraries match these pins
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "websockets", "snmpsim", "pysmi"]  # snmpsim + pysmi: scripts/mvp_check.py

[tool.setuptools.packages.find]
include = ["pandora*"]  # lab/ also holds Python: without this a fresh `pip install -e .` refuses to guess

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes, syntax errors, bugbear, import order: the checks that catch real bugs, not style taste
select = ["F", "E9", "B", "PLE", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pandora"]
