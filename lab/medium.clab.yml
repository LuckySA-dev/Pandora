# Medium campus for the PandoraBox scale run: 12 IOL nodes (2 edge routers, 2 distribution + 8 access
# L2 switches, access pairs cross-linked) and PandoraBox on the same management network.
#   wsl -d Debian -- sleep infinity      (keep open, see small.clab.yml)
#   CLAB_LABDIR_BASE=$HOME/clab containerlab deploy -t lab/medium.clab.yml --reconfigure
#   docker exec -it clab-pandora-medium-pandora python scripts/clab_check.py lab/medium.clab.yml
# clab_check reads this file: nodes, mgmt IPs, which ports are cabled (CDP must see every link) and which
# are free (the first free one becomes that node's reserved mgmt port). Every node keeps one port free.
name: pandora-medium

mgmt:
  network: pandora-medium-mgmt
  ipv4-subnet: 172.30.32.0/24

topology:
  kinds:
    cisco_iol:
      image: vrnetlab/cisco_iol:17.18.02
  defaults:
    kind: cisco_iol
  nodes:
    pandora:
      kind: linux
      image: pandorabox-dev:latest
      mgmt-ipv4: 172.30.32.2
      binds:
        - /mnt/c/Users/User/Desktop/Coding/Pandora:/app
    r1: {mgmt-ipv4: 172.30.32.11}
    r2: {mgmt-ipv4: 172.30.32.12}
    d1: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.32.21}
    d2: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.32.22}
    a1: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.32.31}
    a2: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.32.32}
    a3: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.32.33}
    a4: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.32.34}
    a5: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.32.35}
    a6: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.32.36}
    a7: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.32.37}
    a8: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.32.38}
  links:
    - endpoints: ["r1:Ethernet0/1", "r2:Ethernet0/1"]
    - endpoints: ["r1:Ethernet0/2", "d1:Ethernet0/1"]
    - endpoints: ["r2:Ethernet0/2", "d2:Ethernet0/1"]
    - endpoints: ["d1:Ethernet0/2", "d2:Ethernet0/2"]
    - endpoints: ["d1:Ethernet0/3", "a1:Ethernet0/1"]
    - endpoints: ["d1:Ethernet1/0", "a2:Ethernet0/1"]
    - endpoints: ["d1:Ethernet1/1", "a3:Ethernet0/1"]
    - endpoints: ["d1:Ethernet1/2", "a4:Ethernet0/1"]
    - endpoints: ["d2:Ethernet0/3", "a5:Ethernet0/1"]
    - endpoints: ["d2:Ethernet1/0", "a6:Ethernet0/1"]
    - endpoints: ["d2:Ethernet1/1", "a7:Ethernet0/1"]
    - endpoints: ["d2:Ethernet1/2", "a8:Ethernet0/1"]
    - endpoints: ["a1:Ethernet0/2", "a4:Ethernet0/2"]
    - endpoints: ["a5:Ethernet0/2", "a8:Ethernet0/2"]
    - endpoints: ["a2:Ethernet0/2", "a3:Ethernet0/2"]
    - endpoints: ["a6:Ethernet0/2", "a7:Ethernet0/2"]
