# Large campus for the PandoraBox scale run: 40 IOL nodes (2 edge routers, 4 distribution L3 switches as
# management backbones, 34 access L2 switches, access pairs cross-linked). Generated; same layout rules as
# medium.clab.yml. Needs ~10 GB RAM in WSL: destroy the other labs first.
#   CLAB_LABDIR_BASE=$HOME/clab containerlab deploy -t lab/large.clab.yml --reconfigure
#   docker exec -it clab-pandora-large-pandora python scripts/clab_check.py lab/large.clab.yml
name: pandora-large

mgmt:
  network: pandora-large-mgmt
  ipv4-subnet: 172.30.33.0/24

topology:
  kinds:
    cisco_iol:
      image: vrnetlab/cisco_iol:17.18.02
  defaults:
    kind: cisco_iol
  nodes:
    pandora:
      kind: linux
      image: pandorabox-dev:latest
      mgmt-ipv4: 172.30.33.2
      binds:
        - /mnt/c/Users/User/Desktop/Coding/Pandora:/app
      exec:
        - ip addr add 10.99.0.1/24 dev eth1
    r1: {mgmt-ipv4: 172.30.33.11}
    r2: {mgmt-ipv4: 172.30.33.12}
    d1: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.33.21,
         labels: {pandora.backbone: "10 10.10.0.0/24"}}
    d2: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.33.22,
         labels: {pandora.backbone: "20 10.20.0.0/24"}}
    d3: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.33.23,
         labels: {pandora.backbone: "30 10.30.0.0/24"}}
    d4: {type: L2, image: "vrnetlab/cisco_iol:L2-17.18.02", mgmt-ipv4: 172.30.33.24,
         labels: {pandora.backbone: "40 10.40.0.0/24"}}
